  - id: A1
    source: brief.md
    text: A1：给定 `models.list` 中恰有一个名为 OpenAI ChatGPT/Codex 的当前 UUID 渠道，且本地历史包含
      `openai-codex` usage，刷新后只显示一个官方渠道卡片，卡片同时保留当前账号名称和历史 usage；给定两个匹配账号时不任意归并历史
      usage。
    result: passed
    reason:
      text: A unique current ChatGPT/Codex account receives legacy usage and quota
        aliases; multiple candidates remain separate.
      truncated: false
  - id: A2
    source: brief.md
    text: A2：给定官方 quota 和相同渠道的本地 usage，5h 与 Weekly
      各只显示一行，该行同时包含对应的额度进度/百分比、重置时间以及请求、Token、可用时的费用。
    result: passed
    reason:
      text: 5h and Weekly each render one combined row with usage metrics, quota
        progress/percentage, and reset.
      truncated: false
  - id: A3
    source: brief.md
    text: A3：给定只有 API/本地 usage 的渠道，卡片只显示有数据的统一窗口行而没有空订阅区；给定只有 quota 的渠道，卡片只显示 quota
      行而没有独立的空 API/本地区。
    result: passed
    reason:
      text: API-only and quota-only cards render only available data without empty
        source sections.
      truncated: false
  - id: A4
    source: brief.md
    text: A4：给定 PI-Desktop 已登录的唯一官方账号但没有可读 Codex
      `auth.json`，仍只显示该官方卡片，并准确说明宿主登录已识别但凭证按平台安全边界不可交给插件，同时显示键盘可操作的“登录 Codex”按钮。
    result: passed
    reason:
      text: The recognized official account remains one card without auth.json, with
        accurate security-boundary text and a keyboard-operable login button.
      truncated: false
  - id: A5
    source: brief.md
    text: A5：点击“登录 Codex”时只启动一次本机 `codex login`；启动失败显示错误，进程成功结束后清空 quota 缓存并刷新，绝不把
      token 写入 dashboard snapshot、settings 或日志。
    result: passed
    reason:
      text: Login is single-process, launches correctly on Windows, safely reports
        failure, waits for old refreshes before cache invalidation and forced
        refresh, and never exposes tokens.
      truncated: false
  - id: A6
    source: brief.md
    text: A6：安装清单声明 `net.fetch` 和 `chatgpt.com`，有效 Codex 凭证下 quota 请求通过 PI-Desktop
      审计网络 API 发往既有 usage endpoint；网络、权限和服务端失败仍降级成卡片内原因而不影响本地 usage。
    result: passed
    reason:
      text: Manifest egress permissions, audited pi.net.fetch endpoint use, and
        failure degradation preserve local usage.
      truncated: false
